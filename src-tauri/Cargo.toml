[package]
name = "mustela"
version = "0.1.4-build3"
description = "A compact chat client for Stoat"
edition = "2021"

[lib]
name = "mustela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
url = "2"
tauri-plugin-mustela-native = { path = "plugins/mustela-native" }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"

# Desktop only: game detection and the Rich Presence socket (src/activity.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
# Screen share: capture (xcap), downscale (fast_image_resize) and compress (jpeg-encoder) frames for the call.
xcap = "0.9"
fast_image_resize = "6"
jpeg-encoder = { version = "0.7", features = ["simd"] }
# Notification pictures: avatars arrive as PNG, JPEG, WebP or GIF and are saved as a small PNG for the system.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only to switch on WebRTC / getUserMedia in the Linux webview (off by default in WebKitGTK).
webkit2gtk = { version = "2", features = ["v2_40"] }
# Voice calls on distros whose WebKitGTK was built without WebRTC (Ubuntu's, among others): LiveKit
# from Rust, with the microphone and speakers through cpal (ALSA, which PipeWire and PulseAudio serve).
# Pinned: newer releases need clang 21 to build (most distros ship older), these build with any toolchain.
livekit = { version = "=0.8.3", features = ["rustls-tls-webpki-roots"] }
livekit-api = "=0.6.3"
livekit-protocol = "=0.7.12"
livekit-data-stream = "=0.1.2"
livekit-common = "=0.1.1"
livekit-datatrack = "=0.1.13"
livekit-net = "=0.1.2"
cpal = "0.18"
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Screen share sound from one app (or everything but Mustela): Windows process loopback capture.
wasapi = "0.19"
# Screen share capture: one continuous Windows Graphics Capture session (src/wgc_capture.rs). The same
# version as xcap uses, so they share one copy.
windows = { version = "0.62", features = [
  "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.6"

# Notifications with the sender's picture. The same versions the notification plugin already uses.
[target.'cfg(target_os = "windows")'.dependencies.tauri-winrt-notification]
version = "0.8"
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies.notify-rust]
version = "4.18"

# Small, fast binaries. panic=abort + LTO + strip are the big wins.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
