# Mustela server with HTTPS, for one small Linux machine (e.g. Oracle Cloud's free server).
# Set DOMAIN in .env (copy .env.example), point the domain at this machine, then:  docker compose up -d --build
services:
  mustela:
    build: ..
    restart: unless-stopped
    environment:
      NAME: ${NAME:-Mustela server}
      TRUST_PROXY: "1"
      STOAT_APIS: ${STOAT_APIS:-https://stoat.chat/api}
    volumes:
      - ./data:/data
    expose:
      - "8787"

  # HTTPS in front of it, with a free certificate from Let's Encrypt that renews by itself.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mustela

volumes:
  caddy-data:
  caddy-config:
