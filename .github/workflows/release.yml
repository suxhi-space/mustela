# Makes a GitHub release with every platform's installer, the way the app's updater expects them.
#
#   Push a tag like v0.2.0 (or v0.2.0-beta.1), or run it by hand from the Actions tab with a version.
#
# Each platform builds on its own machine (Tauri can't cross-build installers), stamped with that version and
# pointed at this repository for updates. The release starts as a draft so you can check it, then publish it:
# installed copies only see published releases. Android signing secrets are optional (see README "Releases").
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-latest, artifacts: "release/windows/*" }
          - { platform: macos,   os: macos-latest,   artifacts: "release/macos/*" }
          - { platform: linux,   os: ubuntu-24.04,   artifacts: "release/linux/*" }
          - { platform: android, os: ubuntu-22.04,   artifacts: "release/android/*" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Linux system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libpipewire-0.3-dev libasound2-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libgbm-dev libegl1-mesa-dev libwayland-dev clang
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with: { distribution: temurin, java-version: 17 }
      - name: Android signing key
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "No ANDROID_KEYSTORE_BASE64 secret: the APK gets a debug key."; exit 0; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mustela.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mustela.jks" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        # The tag's leading "v" is dropped: v0.2.0 builds 0.2.0.
        run: node scripts/build.mjs --platform ${{ matrix.platform }} --version "${VERSION#v}" --repo "${{ github.repository }}" --yes
        env:
          CI: "true"
          # Android signing (optional: without these the APK is signed with a debug key). See README "Releases".
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: mustela-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # GitHub records each file's SHA-256, which the updater checks before installing; this list is for people.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          name: Mustela ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          files: dist/*
