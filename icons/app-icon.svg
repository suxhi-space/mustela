<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FD3E0"/>
      <stop offset="0.55" stop-color="#1A9BB0"/>
      <stop offset="1" stop-color="#0B5468"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7FF3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcEEF2"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#032a35" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <!-- weasel bounding in an arch: body is one thick stroke -->
  <g filter="url(#drop)" clip-path="url(#tile)">
    <!-- tail with the stoat's black tip -->
    <path d="M196 742 C 170 700, 168 650, 200 612" fill="none" stroke="url(#fur)" stroke-width="58" stroke-linecap="round"/>
    <path d="M192 760 C 176 738, 168 712, 170 690" fill="none" stroke="#1d2a30" stroke-width="58" stroke-linecap="round"/>
    <!-- body: two arches = a bounding mustelid, and an M -->
    <path d="M206 640 C 230 420, 420 380, 470 560 C 500 670, 530 690, 560 600 C 600 470, 700 420, 790 470"
      fill="none" stroke="url(#fur)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- legs -->
    <path d="M236 650 L 226 760" stroke="url(#fur)" stroke-width="54" stroke-linecap="round"/>
    <path d="M760 520 L 770 640" stroke="url(#fur)" stroke-width="54" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="822" cy="458" rx="104" ry="68" transform="rotate(14 822 458)" fill="url(#fur)"/>
    <circle cx="776" cy="400" r="30" fill="url(#fur)"/><circle cx="776" cy="400" r="14" fill="#f2b8c6"/>
    <ellipse cx="914" cy="496" rx="17" ry="13" fill="#1d2a30"/>
    <circle cx="850" cy="440" r="15" fill="#1d2a30"/>
    <circle cx="855" cy="435" r="5" fill="#fff"/>
  </g>
  <!-- iOS 6 gloss cap -->
  <path d="M64 264 A200 200 0 0 1 264 64 H760 A200 200 0 0 1 960 264 V430 C 760 520, 264 520, 64 430 Z" fill="url(#gloss)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
</svg>
